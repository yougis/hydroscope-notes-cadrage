<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a3a5c"/>
      <stop offset="100%" style="stop-color:#2a5a7c"/>
    </linearGradient>
    <linearGradient id="mapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4e6f1"/>
      <stop offset="100%" style="stop-color:#a8c8dc"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1440" height="900" fill="#f0f4f8"/>

  <!-- Header -->
  <rect x="0" y="0" width="1440" height="56" fill="url(#headerGrad)" rx="0"/>
  <text x="24" y="36" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">HydroScope</text>
  <text x="160" y="36" font-family="Inter, Arial, sans-serif" font-size="12" fill="#c8d8e8">Tableau de bord — Nouvelle-Calédonie</text>
  <circle cx="1380" cy="28" r="12" fill="#4a90d9" opacity="0.8"/>
  <text x="1372" y="33" font-family="Inter, Arial, sans-serif" font-size="10" fill="#fff" text-anchor="middle">OEIL</text>

  <!-- KPI Row -->
  <rect x="0" y="56" width="1440" height="96" fill="#ffffff" stroke="#e0e8f0" stroke-width="1"/>

  <!-- KPI Card 1 -->
  <rect x="16" y="64" width="336" height="80" fill="#ffffff" stroke="#e8eef4" stroke-width="1" rx="6" filter="url(#shadow)"/>
  <text x="28" y="86" font-family="Inter, Arial, sans-serif" font-size="10" fill="#7a8a9a" text-transform="uppercase">Captages</text>
  <text x="28" y="118" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="bold" fill="#1a3a5c">47</text>
  <text x="28" y="136" font-family="Inter, Arial, sans-serif" font-size="9" fill="#9aaab8">dont 12 prioritaires</text>

  <!-- KPI Card 2 -->
  <rect x="368" y="64" width="336" height="80" fill="#ffffff" stroke="#e8eef4" stroke-width="1" rx="6" filter="url(#shadow)"/>
  <text x="380" y="86" font-family="Inter, Arial, sans-serif" font-size="10" fill="#7a8a9a" text-transform="uppercase">Indicateurs</text>
  <text x="380" y="118" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="bold" fill="#1a3a5c">43</text>
  <text x="380" y="136" font-family="Inter, Arial, sans-serif" font-size="9" fill="#9aaab8">suivi en temps réel</text>

  <!-- KPI Card 3 -->
  <rect x="720" y="64" width="336" height="80" fill="#ffffff" stroke="#e8eef4" stroke-width="1" rx="6" filter="url(#shadow)"/>
  <text x="732" y="86" font-family="Inter, Arial, sans-serif" font-size="10" fill="#7a8a9a" text-transform="uppercase">BVAEP</text>
  <text x="732" y="118" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="bold" fill="#1a3a5c">12</text>
  <text x="732" y="136" font-family="Inter, Arial, sans-serif" font-size="9" fill="#9aaab8">bassins versants</text>

  <!-- KPI Card 4 -->
  <rect x="1072" y="64" width="352" height="80" fill="#ffffff" stroke="#e8eef4" stroke-width="1" rx="6" filter="url(#shadow)"/>
  <text x="1084" y="86" font-family="Inter, Arial, sans-serif" font-size="10" fill="#7a8a9a" text-transform="uppercase">Sources</text>
  <text x="1084" y="118" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="bold" fill="#1a3a5c">43</text>
  <text x="1084" y="136" font-family="Inter, Arial, sans-serif" font-size="9" fill="#9aaab8">connectées</text>

  <!-- Main Area -->
  <rect x="0" y="152" width="1440" height="688" fill="#f0f4f8"/>

  <!-- Map View -->
  <rect x="16" y="160" width="984" height="672" fill="#dce8f0" rx="6" stroke="#c0d0e0" stroke-width="1"/>
  <!-- Map grid lines -->
  <line x1="16" y1="300" x2="1000" y2="300" stroke="#c8d8e8" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="16" y1="450" x2="1000" y2="450" stroke="#c8d8e8" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="16" y1="600" x2="1000" y2="600" stroke="#c8d8e8" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="250" y1="160" x2="250" y2="832" stroke="#c8d8e8" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="500" y1="160" x2="500" y2="832" stroke="#c8d8e8" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="750" y1="160" x2="750" y2="832" stroke="#c8d8e8" stroke-width="0.5" stroke-dasharray="4,4"/>
  <!-- Map content placeholder -->
