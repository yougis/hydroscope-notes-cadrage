  <text x="500" y="404" font-family="Inter, Arial, sans-serif" font-size="11" fill="#8aa0b0" text-anchor="middle">Bassins versants &amp; captages — Nouvelle-Calédonie</text>
  <!-- Map markers (simulated) -->
  <circle cx="300" cy="250" r="8" fill="#e74c3c" opacity="0.8"/>
  <circle cx="300" cy="250" r="4" fill="#c0392b"/>
  <circle cx="550" cy="350" r="6" fill="#e67e22" opacity="0.8"/>
  <circle cx="550" cy="350" r="3" fill="#d35400"/>
  <circle cx="700" cy="200" r="7" fill="#27ae60" opacity="0.8"/>
  <circle cx="700" cy="200" r="3.5" fill="#1e8449"/>
  <circle cx="400" cy="500" r="5" fill="#3498db" opacity="0.8"/>
  <circle cx="400" cy="500" r="2.5" fill="#2471a3"/>
  <circle cx="650" cy="550" r="6" fill="#8e44ad" opacity="0.8"/>
  <circle cx="650" cy="550" r="3" fill="#6c3483"/>
  <!-- Legend -->
  <rect x="20" y="780" width="140" height="36" fill="#ffffff" rx="3" opacity="0.9"/>
  <circle cx="36" cy="798" r="4" fill="#e74c3c"/>
  <text x="48" y="802" font-family="Inter, Arial, sans-serif" font-size="8" fill="#5a7a8a">Captage</text>
  <circle cx="100" cy="798" r="4" fill="#27ae60"/>
  <text x="112" y="802" font-family="Inter, Arial, sans-serif" font-size="8" fill="#5a7a8a">BVAEP</text>

