  <text x="1380" y="315" font-family="Inter, Arial, sans-serif" font-size="8" fill="#9aaab8">4h</text>

  <rect x="1044" y="324" width="360" height="22" fill="#ffffff" rx="2"/>
  <circle cx="1058" cy="335" r="4" fill="#3498db"/>
  <text x="1070" y="339" font-family="Inter, Arial, sans-serif" font-size="9" fill="#4a5a6a">Qualité eau — Mont-Dore</text>
  <text x="1380" y="339" font-family="Inter, Arial, sans-serif" font-size="8" fill="#9aaab8">6h</text>

  <rect x="1044" y="348" width="360" height="22" fill="#fafbfc" rx="2"/>
  <circle cx="1058" cy="359" r="4" fill="#8e44ad"/>
  <text x="1070" y="363" font-family="Inter, Arial, sans-serif" font-size="9" fill="#4a5a6a">Niveau nappe — Païta</text>
  <text x="1380" y="363" font-family="Inter, Arial, sans-serif" font-size="8" fill="#9aaab8">12h</text>

  <rect x="1044" y="372" width="360" height="22" fill="#ffffff" rx="2"/>
  <circle cx="1058" cy="383" r="4" fill="#e74c3c"/>
  <text x="1070" y="387" font-family="Inter, Arial, sans-serif" font-size="9" fill="#4a5a6a">Saturation sol — Koné</text>
  <text x="1380" y="387" font-family="Inter, Arial, sans-serif" font-size="8" fill="#9aaab8">24h</text>

  <rect x="1044" y="396" width="360" height="22" fill="#fafbfc" rx="2"/>
  <circle cx="1058" cy="407" r="4" fill="#27ae60"/>
  <text x="1070" y="411" font-family="Inter, Arial, sans-serif" font-size="9" fill="#4a5a6a">Température — Lifou</text>
  <text x="1380" y="411" font-family="Inter, Arial, sans-serif" font-size="8" fill="#9aaab8">1d</text>

  <rect x="1044" y="420" width="360" height="22" fill="#ffffff" rx="2"/>
  <circle cx="1058" cy="431" r="4" fill="#3498db"/>
  <text x="1070" y="435" font-family="Inter, Arial, sans-serif" font-size="9" fill="#4a5a6a">Salinité — Île des Pins</text>
  <text x="1380" y="435" font-family="Inter, Arial, sans-serif" font-size="8" fill="#9aaab8">1d</text>

  <rect x="1044" y="444" width="360" height="22" fill="#fafbfc" rx="2"/>
  <circle cx="1058" cy="455" r="4" fill="#e67e22"/>
  <text x="1070" y="459" font-family="Inter, Arial, sans-serif" font-size="9" fill="#4a5a6a">Turbidité — Bourail</text>
  <text x="1380" y="459" font-family="Inter, Arial, sans-serif" font-size="8" fill="#9aaab8">2d</text>

  <!-- Status bar at bottom of sidebar -->
  <rect x="1028" y="530" width="392" height="1" fill="#e8eef4"/>
  <text x="1044" y="544" font-family="Inter, Arial, sans-serif" font-size="8" fill="#9aaab8">5 indicateurs mis à jour aujourd'hui</text>

  <!-- Footer -->
  <rect x="0" y="840" width="1440" height="30" fill="#1a3a5c"/>
  <text x="24" y="859" font-family="Inter, Arial, sans-serif" font-size="8" fill="#a0b8c8">HydroScope · OEIL · Données Nouvelle-Calédonie · © 2026</text>
  <text x="1300" y="859" font-family="Inter, Arial, sans-serif" font-size="8" fill="#a0b8c8" text-anchor="end">v0.1 — Projet pilote</text>
</svg>