  <line x1="1028" y1="194" x2="1408" y2="194" stroke="#e0e8f0" stroke-width="1"/>

  <!-- Filter Chips -->
  <rect x="1028" y="202" width="72" height="26" fill="#e8f0f8" rx="13" stroke="#c0d0e0" stroke-width="0.5"/>
  <text x="1064" y="219" font-family="Inter, Arial, sans-serif" font-size="9" fill="#3a5a6a" text-anchor="middle">En cours</text>

  <rect x="1108" y="202" width="60" height="26" fill="#fde8e8" rx="13" stroke="#f5c6c6" stroke-width="0.5"/>
  <text x="1138" y="219" font-family="Inter, Arial, sans-serif" font-size="9" fill="#a04040" text-anchor="middle">Alerte</text>

  <rect x="1176" y="202" width="64" height="26" fill="#e8f5e8" rx="13" stroke="#b8d8b8" stroke-width="0.5"/>
  <text x="1208" y="219" font-family="Inter, Arial, sans-serif" font-size="9" fill="#3a6a3a" text-anchor="middle">Normal</text>

  <rect x="1248" y="202" width="72" height="26" fill="#fef3e0" rx="13" stroke="#e8d0a0" stroke-width="0.5"/>
  <text x="1284" y="219" font-family="Inter, Arial, sans-serif" font-size="9" fill="#8a6a3a" text-anchor="middle">Historique</text>

  <rect x="1328" y="202" width="72" height="26" fill="#f0e8f8" rx="13" stroke="#d0c0e0" stroke-width="0.5"/>
  <text x="1364" y="219" font-family="Inter, Arial, sans-serif" font-size="9" fill="#5a3a7a" text-anchor="middle">Satellite</text>

  <!-- Indicator List -->
  <rect x="1028" y="240" width="392" height="280" fill="#fafbfc" rx="4" stroke="#e8eef4" stroke-width="1"/>
  <text x="1044" y="260" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#1a3a5c">Derniers indicateurs</text>

  <rect x="1044" y="268" width="360" height="1" fill="#e8eef4"/>

  <!-- Indicator rows -->
  <rect x="1044" y="276" width="360" height="22" fill="#ffffff" rx="2"/>
  <circle cx="1058" cy="287" r="4" fill="#27ae60"/>
  <text x="1070" y="291" font-family="Inter, Arial, sans-serif" font-size="9" fill="#4a5a6a">Précipitations — Nouméa</text>
  <text x="1380" y="291" font-family="Inter, Arial, sans-serif" font-size="8" fill="#9aaab8">2h</text>

  <rect x="1044" y="300" width="360" height="22" fill="#fafbfc" rx="2"/>
  <circle cx="1058" cy="311" r="4" fill="#e67e22"/>
