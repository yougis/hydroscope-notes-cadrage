server {
    listen 8090;
    server_name localhost;

    # Proxy /api to serveur-cache
    location /api/ {
        proxy_pass http://serveur-cache:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy /gmaps-js to Google Maps API (vite proxy target) - match vite rewrite
    location /gmaps-js {
        proxy_pass https://maps.googleapis.com/maps/api/js;
        proxy_set_header Host maps.googleapis.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
    }

    # Proxy everything else to Vite dev server with WebSocket support
    location / {
        proxy_pass http://pnpm-dev:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }
}