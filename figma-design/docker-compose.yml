name: hydroscope

services:
  nginx:
    image: nginx:stable-alpine
    container_name: hydroscope-nginx
    ports:
      - "8090:8090"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks:
      - hydroscope-shared
    depends_on:
      - pnpm-dev

  pnpm-dev:
    image: node:22
    container_name: pnpm-dev
    working_dir: /app
    command: >
      sh -c "corepack enable && corepack prepare pnpm@10.34.3 --activate &&
      pnpm install --frozen-lockfile 2>&1 &&
      exec pnpm dev --port 5173 --strictPort --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - "/home/yogis/SynologyDrive/Projects/hydroscope/documents projet/Notes de cadrage/figma-design:/app"
    restart: unless-stopped
    networks:
      - hydroscope-shared

networks:
  hydroscope-shared:
    external: true
