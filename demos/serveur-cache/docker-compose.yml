version: '3.8'

services:
  serveur-cache:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hydroscope-serveur-cache
    ports:
      - "8081:8081"
    environment:
      - TTL_HOURS=${TTL_HOURS:-24}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s