version: '3.8'

services:
  serveur-cache:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hydroscope-serveur-cache
    ports:
      - "8081:8081"
    environment:
      - TTL_HOURS=${TTL_HOURS:-24}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8081/health', timeout=5).status == 200 else 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - hydroscope-shared

networks:
  hydroscope-shared:
    external: true