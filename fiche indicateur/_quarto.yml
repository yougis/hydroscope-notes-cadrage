    toc-depth: 3
    number-sections: false
    lang: fr
    geometry: margin=2.5cm
    colorlinks: true
    include-in-header:
      text: '\usepackage{fancyhdr}

        \pagestyle{fancy}

        \fancyfoot[C]{\small Copyright Yapuka SARL — 2026. Tous droits réservés.}

        \fancyfoot[R]{\small \thepage}

        '
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    lang: fr
execute:
  echo: false
  freeze: auto
