<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>HydroScope — Graphe des dépendances US</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  /* Police pour les icônes de rôle dans le graphe (Font Awesome Solid exposé sous un nom de famille
     au poids que vis-network utilise pour dessiner node.icon, afin que les glyphes se résolvent). */
  @font-face {
    font-family: 'HydroIcons';
    font-style: normal;
    font-weight: 400;
    font-display: block;
    src: url('https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/webfonts/fa-solid-900.woff2') format('woff2');
  }
  body { font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; margin: 0; color: #e6e8eb; background: #17191d; }
  header { padding: 12px 18px; background: #101215; color: #fff; }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 4px 0 0; font-size: 13px; opacity: .85; }
  #controls { padding: 10px 18px; background: #1c1f24; border-bottom: 1px solid #2a2e35; }
  #controls label { margin-right: 14px; font-size: 13px; cursor: pointer; display: inline-block; white-space: nowrap; color: #cfd3d8; }
  #controls b { color: #e6e6eb; }
  #controls .chip { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 4px; vertical-align: middle; }
  button { padding: 6px 12px; margin-left: 10px; cursor: pointer; border: 1px solid #2f6f9f; background: #14324d; color: #fff; border-radius: 4px; font-size: 13px; }
  button:hover { background: #1d4a70; }
  #legend { font-size: 13px; padding: 8px 18px; background: #1c1f24; color: #e6e6eb; border-bottom: 1px solid #2a2e35; }
  #legend b { margin-right: 8px; }
  .legend-item { display: inline-block; margin-right: 12px; color: #e6e6eb; }
  #groupnav { padding: 8px 18px; background: #1c1f24; border-bottom: 1px solid #2a2e35; font-size: 13px; }
  #groupnav .gn-btn { display: inline-block; margin: 2px 4px; padding: 4px 10px; border-radius: 12px; cursor: pointer; border: 1px solid #fff; background: #2a2e35; font-size: 12px; color: #fff; }
  #groupnav .gn-btn:hover { border-color: #7fc0ff; }
  #groupnav .gn-btn.active { border: 2px solid #fff; box-shadow: 0 0 0 2px #17191d; }
  #graph { width: 100%; height: calc(100vh - 230px); background: #14161a; }
  #count { font-size: 13px; color: #9aa1a8; margin-left: 12px; }
  #facets { padding: 8px 18px; background: #17191d; border-bottom: 1px solid #2a2e35; font-size: 13px; color: #e6e6eb; }
  #facets b { color: #e6e6eb; }
  #facets .facet-group { margin-right: 24px; display: inline-block; }
  .facet-pill { display: inline-block; margin: 2px 4px; padding: 3px 10px; border-radius: 12px; cursor: pointer; border: 1px solid #4a4f57; background: #2a2e35; color: #e6e8eb; font-size: 12px; user-select: none; }
  .facet-pill:hover { border-color: #7fc0ff; }
  .facet-pill.on { background: #2f6f9f; color: #fff; border-color: #7fc0ff; }
  .facet-clear { margin-left: 6px; color: #ff6b6b; cursor: pointer; font-weight: bold; }
  #status { font-size: 12px; padding: 4px 18px; background: #101215; color: #9aa1a8; border-bottom: 1px solid #2a2e35; }
  #status b { color: #7fc0ff; }
  #detail { position: fixed; top: 0; right: 0; bottom: 0; width: 400px; min-width: 300px; max-width: 80vw;
    background: #1c1f24; box-shadow: -3px 0 12px rgba(0,0,0,.5); z-index: 1000; overflow-y: auto;
    display: flex; flex-direction: column; border-left: 1px solid #2a2e35; color: #e6e8eb; }
  #detail.closed { display: none; }
  #detail #d-resizer { width: 6px; cursor: col-resize; background: #2a2e35; flex-shrink: 0; }
  #detail #d-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: #101215; color: #fff; }
  #detail #d-title { font-weight: bold; font-size: 15px; }
  #detail #d-close { cursor: pointer; font-size: 20px; line-height: 1; padding: 0 6px; }
  #detail #d-body { padding: 14px; flex: 1; overflow-y: auto; font-size: 13px; }
  #detail .prop { margin-bottom: 10px; }
  #detail .prop .k { font-weight: bold; color: #7fc0ff; margin-bottom: 2px; }
  #detail .prop .v { color: #e6e8eb; }
  #detail .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; color: #fff; }
  /* ── Formulaire d'édition ── */
  #detail .form-field { margin-bottom: 12px; }
  #detail .form-field label { display: block; font-weight: bold; color: #7fc0ff; margin-bottom: 3px; font-size: 12px; }
  #detail .form-field label .req { color: #ff6b6b; }
  #detail input[type=text], #detail select, #detail textarea {
    width: 100%; box-sizing: border-box; background: #17191d; border: 1px solid #2a2e35; color: #e6e8eb;
    border-radius: 4px; padding: 5px 8px; font-size: 13px; font-family: inherit; }
  #detail textarea { min-height: 60px; resize: vertical; }
  #detail .dep-wrap { border: 1px solid #2a2e35; background: #17191d; border-radius: 4px; padding: 5px 6px; }
  #detail .dep-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 5px; }
  #detail .chip { display: inline-block; background: #14324d; border: 1px solid #2f6f9f; color: #fff;
    border-radius: 10px; padding: 2px 8px; font-size: 12px; cursor: pointer; }
  #detail .chip .x { margin-left: 4px; color: #ff6b6b; }
  #detail .dep-input-row { display: flex; gap: 6px; }
  #detail .dep-input-row input { flex: 1; }
  #d-actions { display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid #2a2e35; background: #101215; }
  #d-actions button { margin-left: 0; flex: 1; }
  #d-actions .danger { background: #4a1515; border-color: #8c2a2a; }
  #d-actions .danger:hover { background: #6e1f1f; }
  #toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    background: #14324d; border: 1px solid #2f6f9f; color: #fff; padding: 8px 16px; border-radius: 6px;
    font-size: 13px; z-index: 2000; display: none; max-width: 90vw; }
  #toast.error { background: #4a1515; border-color: #8c2a2a; }
  /* Scénario chips */
  .scenario-chip { display: inline-flex; align-items: center; gap: 4px; background: #1a3a5c; border: 1px solid #2f6f9f; color: #fff; border-radius: 10px; padding: 2px 8px; font-size: 12px; cursor: pointer; margin: 2px; }
  .scenario-chip:hover { background: #244a7a; }
  .scenario-chip .x { color: #ff6b6b; cursor: pointer; margin-left: 4px; }
</style>
</head>
<body>
<header>
  <h1>HydroScope — Graphe des dépendances User Stories</h1>
  <p>Arcs orientés = relation <b>parent → enfant</b>. Zoom, pan et glisser-déposer des nœuds pour naviguer. Cliquez sur un nœud pour le détail.</p>
</header>

<div id="status"></div>

<div id="controls">
  <button onclick="resetView()">Réinitialiser la vue</button>
  <button id="btnFilter" onclick="toggleLinked()">Afficher US liées uniquement</button>
  <button id="btnNew" onclick="newUs()" style="display:none">+ Nouvelle US</button>
  <span id="colorby"><b>Colorier par :</b>
    <label><input type="radio" name="coloring" value="epic" checked onchange="setColoring(this.value)"> EPIC</label>
    <label><input type="radio" name="coloring" value="finalite" onchange="setColoring(this.value)"> Type fonctionnel</label>
  </span>
  <span id="count"></span>
</div>

<div id="groupnav"></div>

<div id="facets">
  <span class="facet-group"><b>ROLE :</b> <span id="facet-role"></span></span>
  <span class="facet-group"><b>IHM :</b> <span id="facet-ihm"></span></span>
  <span class="facet-group"><b>MVP :</b> <span id="facet-mvp"></span></span>
</div>

<div id="legend"></div>
<div id="graph"></div>

<div id="detail" class="closed">
  <div id="d-resizer" title="Redimensionner"></div>
  <div id="d-header">
    <span id="d-title">Détail de l'US</span>
    <span id="d-close" onclick="closeDetail()" title="Fermer">✕</span>
  </div>
  <div id="d-body"></div>
  <div id="d-actions" style="display:none"></div>
</div>

<div id="toast"></div>

<script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<script>
// ---------- Données des US ----------
const EPICS = {
  "EPIC 1": "#d32f2f", "EPIC 1bis": "#f57c00", "EPIC 2": "#fbc02d",
  "EPIC 3": "#43a047", "EPIC 4": "#2e7d32", "EPIC 5": "#00897b",
  "EPIC 6": "#1976d2", "EPIC 7": "#5e35b1", "EPIC 8": "#8e24aa",
  "EPIC 9": "#6d4c41", "EPIC 10": "#546e7a"
};

const EPIC_LABELS = {
  "EPIC 1": "Gestion des données",
  "EPIC 1bis": "Catalogage des données",
  "EPIC 2": "Qualité des données",
  "EPIC 3": "Référentiels",
  "EPIC 4": "Calcul d'indicateurs",
  "EPIC 5": "Analyse multicritère",
  "EPIC 6": "Visualisation",
  "EPIC 7": "Aide à la décision",
  "EPIC 8": "Export & diffusion",
  "EPIC 9": "Gestion des utilisateurs",
  "EPIC 10": "Traçabilité & audit"
};

// Nom complet d'un EPIC (ex. "EPIC 1 – Gestion des données")
const EPIC_FULL = code => code + ' – ' + EPIC_LABELS[code];

// ---------- Source de données ----------
const BACKLOG_URL = 'https://raw.githubusercontent.com/yougis/hydroscope-notes-cadrage/refs/heads/main/cahier%20des%20charges/backlog.csv';
const API_BASE = '/api';

let EDIT_MODE = false;
let FILE_INFO = null;

let US_DATA = {};        // id -> { epic, nom, libelle, mvp, frontback, module, depend[], typ, pilier, role, phrase, row }
let US = {};             // id -> [epic, libelle]
let US_FINALITE = {};    // id -> type fonctionnel
let DEP = [];            // [parent, child]

// Scénarios (Besoins testables)
let SCENARIOS_BY_US = {}; // usId -> [{ident, libelle, scenario, ...}]
let SCENARIOS_MAP = {};   // ident -> full scenario object

// ---------- Helpers ----------
function toast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = type === 'error' ? 'error' : '';
  t.style.display = 'block';
  clearTimeout(t._h);
  t._h = setTimeout(() => { t.style.display = 'none'; }, 4000);
}

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
  '&': '&',
  '<': '<',
  '>': '>',
  '"': '"',
  "'": "'"
}[c]));

// Parsing CSV RFC4180 (séparateur ';', champs quotés, retours à la ligne CRLF/LF)
function parseCSV(text) {
  const rows = []; let row = [], field = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i], n = text[i + 1];
    if (inQ) {
      if (c === '"' && n === '"') { field += '"'; i++; }
      else if (c === '"') inQ = false;
      else field += c;
    } else if (c === '"') inQ = true;
    else if (c === ';') { row.push(field); field = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && n === '\n') i++;
      row.push(field); field = '';
      if (row.some(f => f.trim() !== '')) rows.push(row);
      row = [];
    } else field += c;
  }
  if (field !== '' || row.length) { row.push(field); if (row.some(f => f.trim() !== '')) rows.push(row); }
  return rows;
}

// Cellule EPIC "EPIC 1 – Gestion des données" -> { code:'EPIC 1', label:'Gestion des données' }
function parseEpic(cell) {
  const t = String(cell || '').trim();
  const m = /^(EPIC\s+[^–-]+?)\s*[–-]\s*(.*)$/.exec(t);
  if (m) return { code: m[1].trim(), label: m[2].trim() };
  return { code: t, label: t };
}

// Charge le backlog via l'API locale (mode édition)
function ingestUs(list) {
  US_DATA = {}; US = {}; US_FINALITE = {}; DEP = [];
  for (const d of list) {
    const id = String(d.id || '').trim();
    if (!id) continue;
    const epic = parseEpic(d.epic).code;
    const frontback = String(d.frontback || '');
    US_DATA[id] = {
      epic, nom: id, libelle: String(d.libelle || ''),
      mvp: String(d.mvp || ''),
      frontback,
      ihm: frontback.toLowerCase().startsWith('front') ? 'OUI' : 'NON',
      module: String(d.module || ''),
      depend: Array.isArray(d.depend) ? d.depend : [],
      typ: String(d.typ || ''),
      pilier: String(d.pilier || ''),
      role: String(d.role || ''),
      phrase: String(d.phrase || ''),
      row: d.row
    };
    US[id] = [epic, String(d.libelle || '')];
    US_FINALITE[id] = String(d.typ || '');
    (Array.isArray(d.depend) ? d.depend : []).forEach(p => { if (p) DEP.push([p, id]); });
  }
}

// Charge les données depuis backlog.csv (mode lecture / page statique)
async function loadCsvData() {
  const res = await fetch(BACKLOG_URL);
  if (!res.ok) throw new Error('Impossible de charger le backlog (HTTP ' + res.status + ')');
  const rows = parseCSV(await res.text());
  const header = rows[0].map(h => h.trim());
  const col = name => header.indexOf(name);
  const iId = col('ID User Story'), iEpic = col('EPIC'), iLib = col('Libellé User Story'),
        iMvp = col('MVP'), iFeB = col('Front_or_Back'), iMod = col('Module'),
        iDep = col('Dépend de (Parent)'), iTyp = col('Type fonctionnel'),
        iRole = col('Profil utilisateur'), iPhrase = col('Phrase méthode agile');

  const list = [];
  for (let r = 1; r < rows.length; r++) {
    const get = k => (rows[r][k] || '').trim();
    const id = get(iId);
    if (!id) continue;
    list.push({
      id,
      epic: get(iEpic),
      libelle: get(iLib),
      mvp: get(iMvp),
      frontback: get(iFeB),
      module: get(iMod),
      depend: get(iDep) ? get(iDep).split(';').map(s => s.trim()).filter(Boolean) : [],
      typ: get(iTyp),
      pilier: '',
      role: get(iRole),
      phrase: get(iPhrase),
    });
  }
  ingestUs(list);
  // pas de scénarios en mode lecture seule (CSV ne les contient pas)
}

// Charge les données via l'API locale (mode édition)
async function loadApiData() {
  const res = await fetch(API_BASE + '/backlog');
  if (!res.ok) throw new Error('Impossible de charger le backlog API (HTTP ' + res.status + ')');
  const data = await res.json();
  FILE_INFO = { file: data.file, archiveDir: data.archiveDir };
  ingestUs(data.us || []);
  // Scénarios
  SCENARIOS_BY_US = {};
  SCENARIOS_MAP = {};
  if (Array.isArray(data.scenarios)) {
    for (const sc of data.scenarios) {
      SCENARIOS_MAP[sc.ident] = sc;
      if (!SCENARIOS_BY_US[sc.usId]) SCENARIOS_BY_US[sc.usId] = [];
      SCENARIOS_BY_US[sc.usId].push(sc);
    }
  }
}

async function loadUsData() {
  if (EDIT_MODE) return loadApiData();
  return loadCsvData();
}

const FINALITES = {
  "Acquisition": { color: "#8a7530", bord: "#5f4f20", groupe: "Pilier 1 – Connaissance" },
  "Structuration": { color: "#a38a24", bord: "#6e5c14", groupe: "Pilier 1 – Connaissance" },
  "Qualification": { color: "#c08a1a", bord: "#845c0e", groupe: "Pilier 1 – Connaissance" },
  "Exploitation": { color: "#c56e16", bord: "#86480b", groupe: "Pilier 2 (+3) – Diagnostic & Veille" },
  "Restitution – Diffusion": { color: "#b04918", bord: "#742e0e", groupe: "Pilier 4 – Partage" },
  "Gouvernance": { color: "#9c2d1e", bord: "#5e150c", groupe: "Transverse – Socle" }
};

const TYPES = Object.keys(FINALITES);

const PILIERS = [
  'Pilier 1 – Connaissance & Caractérisation',
  'Pilier 1 – Connaissance & Caractérisation (fondement)',
  'Pilier 2 – Diagnostic & Analyse multicritère (+ Pilier 3)',
  'Pilier 4 – Partage & Diffusion',
  'Transverse (socle)'
];

const ROLES = ['Administrateur expert data', 'Administrateur plateforme', 'Décideur métier', 'Expert métier eau potable', 'Intéressé public'];

const ROLE_ICONS = {
  'Administrateur expert data': { cls: 'fa-wrench',     code: '\uf0ad' },
  'Administrateur plateforme':  { cls: 'fa-gear',       code: '\uf013' },
  'Décideur métier':            { cls: 'fa-chart-line', code: '\uf201' },
  'Expert métier eau potable':  { cls: 'fa-droplet',    code: '\uf043' },
  'Intéressé public':           { cls: 'fa-users',      code: '\uf0c0' }
};
const FALLBACK_ICON = { cls: 'fa-user', code: '\uf007' };
const roleIcon = r => ROLE_ICONS[r] || FALLBACK_ICON;

// ---------- Construction ----------
let currentColoring = 'epic';

function renderLegend(mode) {
  document.getElementById('legend').innerHTML = '';
}

function wrapLabel(text, maxLen) {
  if (!text) return '';
  if (text.length <= maxLen) return text;
  const half = Math.floor(text.length / 2);
  let split = -1;
  for (let i = 0; i <= Math.floor(maxLen / 2); i++) {
    if (text[half - i] === ' ') { split = half - i; break; }
    if (text[half + i] === ' ') { split = half + i; break; }
  }
  if (split < 0) return text;
  return text.slice(0, split).trim() + '\n' + text.slice(split).trim();
}

function nodeAppearance(id) {
  const [epic, label] = US[id];
  const wrapped = wrapLabel(label, 26);
  const roleIconDef = roleIcon(US_DATA[id].role);
  const stdFont = "'Segoe UI', -apple-system, Arial, sans-serif";
  if (currentColoring === 'epic') {
    return { id: id, label: wrapped, sublabel: id,
             color: EPICS[epic], borderWidth: 1, borderWidthSelected: 2,
             title: epic + ' (' + EPIC_LABELS[epic] + ') — ' + id + ' — ' + label,
             icon: { face: 'HydroIcons', code: roleIconDef.code, color: '#fff' },
             font: { color: '#fff', size: 13, face: stdFont, bold: true },
             sublabelFont: { color: '#fff', size: 10, face: 'monospace' } };
  }
  const fin = FINALITES[US_FINALITE[id]];
  return { id: id, label: wrapped, sublabel: id, color: fin.color, borderWidth: 2, borderWidthSelected: 3,
           title: US_FINALITE[id] + ' — ' + id + ' — ' + label,
           icon: { face: 'HydroIcons', code: roleIconDef.code, color: '#fff' },
           font: { color: '#fff', size: 13, face: stdFont, bold: true },
           sublabelFont: { color: '#fff', size: 10, face: 'monospace' } };
}

function setColoring(mode) {
  currentColoring = mode;
  renderLegend(mode);
  renderGroupNav();
  allNodes = buildNodes();
  if (activeGroup) applyFilter();
  else window.network.body.data.nodes.update(allNodes);
}

// ---------- Navigation & filtrage par groupe ----------
let activeGroup = null;
let linkedOnly = false;

// ---------- Facettes (ROLE, IHM, MVP) dynamiques ----------
let facets = { role: new Set(), ihm: new Set(), mvp: new Set() };

function facetValues(key) {
  const set = new Set();
  Object.values(US_DATA).forEach(d => {
    if (key === 'role') set.add(d.role);
    else if (key === 'ihm') set.add(d.ihm);
    else if (key === 'mvp') set.add(d.mvp);
  });
  return [...set].sort((a, b) => String(a).localeCompare(String(b), 'fr'));
}

const FACET_DEFS = {
  role: { container: 'facet-role' },
  ihm: { container: 'facet-ihm' },
  mvp: { container: 'facet-mvp' }
};

function renderFacets() {
  for (const [key, def] of Object.entries(FACET_DEFS)) {
    const el = document.getElementById(def.container);
    const values = facetValues(key);
    let html = values.map(v => {
      const on = facets[key].has(v) ? ' on' : '';
      const icon = key === 'role' ? `<i class="fa-solid ${roleIcon(v).cls}"></i> ` : '';
      return `<span class="facet-pill${on}" onclick="toggleFacet('${key}','${esc(v)}')">${icon}${esc(v)}</span>`;
    }).join('');
    if (facets[key].size) html += `<span class="facet-clear" onclick="clearFacet('${key}')">✕ effacer</span>`;
    el.innerHTML = html;
  }
}

function toggleFacet(key, value) {
  if (facets[key].has(value)) facets[key].delete(value);
  else facets[key].add(value);
  renderFacets();
  applyFilter();
}

function clearFacet(key) {
  facets[key].clear();
  renderFacets();
  applyFilter();
}

function facetMatches(id) {
  const d = US_DATA[id];
  if (facets.role.size && !facets.role.has(d.role)) return false;
  if (facets.ihm.size && !facets.ihm.has(d.ihm)) return false;
  if (facets.mvp.size && !facets.mvp.has(d.mvp)) return false;
  return true;
}

// ---------- Volet Détail (clic sur une US) ----------
let detailOpen = false;
let editingId = null;    // id de l'US en cours d'édition (null = nouvelle)
let dependList = [];     // chips « Dépend de » du formulaire
let scenarioEditing = false; // true quand on affiche une fiche scénario
let currentScenarioIdent = null;

function depText(d) {
  if (!d.depend || !d.depend.length) return '<em>aucun</em>';
  const pills = d.depend.map(p => `<span class="facet-pill" onclick="openDetail('${p}')">${p}</span>`).join(' ');
  return pills;
}

// --- Rendu scénarios (lecture seule) ---
function renderScenariosReadOnly(usId) {
  const list = SCENARIOS_BY_US[usId] || [];
  if (!list.length) return '<div class="prop"><div class="k">Besoins testables</div><div class="v"><em>aucun</em></div></div>';
  const chips = list.map(sc => `<span class="scenario-chip" onclick="openScenario('${esc(sc.ident)}')">${esc(sc.ident)} – ${esc(sc.libelle)}</span>`).join(' ');
  return `<div class="prop"><div class="k">Besoins testables</div><div class="v">${chips}</div></div>`;
}

// Affichage lecture seule (page statique, sans serveur)
function renderReadOnly(d) {
  return `
    <div class="prop"><div class="k">EPIC</div><div class="v">${esc(d.epic)} · ${esc(EPIC_LABELS[d.epic])}</div></div>
    <div class="prop"><div class="k">Type fonctionnel</div><div class="v">${esc(d.typ)}</div></div>
    <div class="prop"><div class="k">Pilier(s)</div><div class="v">${esc(d.pilier || '—')}</div></div>
    <div class="prop"><div class="k">Module</div><div class="v">${esc(d.module)}</div></div>
    <div class="prop"><div class="k">ROLE (profil utilisateur)</div><div class="v"><i class="fa-solid ${roleIcon(d.role).cls}"></i> ${esc(d.role)}</div></div>
    <div class="prop"><div class="k">IHM</div><div class="v">${esc(d.ihm)}</div></div>
    <div class="prop"><div class="k">MVP</div><div class="v">${esc(d.mvp)}</div></div>
    <div class="prop"><div class="k">Dépend de (parents)</div><div class="v">${depText(d)}</div></div>
    <div class="prop"><div class="k">Phrase méthode agile</div><div class="v">${esc(d.phrase || '—')}</div></div>
    ${renderScenariosReadOnly(d.nom)}`;
}

// Formulaire d'édition (mode édition)
function usListHtml() {
  return Object.keys(US).map(id => `<option value="${esc(id)}">`).join('');
}

function epicOptions() {
  return Object.keys(EPICS).map(code => `<option value="${esc(EPIC_FULL(code))}">${esc(EPIC_FULL(code))}</option>`).join('');
}

// Rendu liste scénarios dans le formulaire d'édition
function renderScenariosEdit(usId) {
  const list = SCENARIOS_BY_US[usId] || [];
  const chips = list.map(sc => `
    <span class="scenario-chip" onclick="openScenario('${esc(sc.ident)}')">
      ${esc(sc.ident)} – ${esc(sc.libelle)}
      <span class="x" onclick="event.stopPropagation(); deleteScenario('${esc(sc.ident)}')">✕</span>
    </span>`).join(' ');
  const addBtn = EDIT_MODE ? `<button type="button" class="scenario-chip" style="background:#2a4a6b;border-color:#4a8fc7;" onclick="addScenario()"><i class="fa-solid fa-plus"></i> Ajouter</button>` : '';
  return `<div class="form-field"><label>Besoins testables (scénarios)</label><div>${chips}${addBtn}</div></div>`;
}

function renderEditForm(d) {
  const epicVal = d ? EPIC_FULL(parseEpic(d.epic).code) : EPIC_FULL('EPIC 1');
  const mvpVal = d ? d.mvp : 'True';
  const frontVal = d ? d.frontback : 'Front-end';
  const typVal = d ? d.typ : '';
  const pilierVal = d ? d.pilier : '';
  const roleVal = d ? d.role : '';
  const depChips = (d ? d.depend : []).slice();

  dependList = depChips;

  document.getElementById('d-actions').style.display = 'flex';
  document.getElementById('d-actions').innerHTML = `
    <button id="btn-save" onclick="saveForm()">${d ? 'Enregistrer' : 'Créer l' + "'" + 'US'}</button>
    <button onclick="closeDetail()">Annuler</button>
    ${d ? '<button class="danger" onclick="deleteForm()">Supprimer</button>' : ''}
  `;

  const scenariosHtml = d ? renderScenariosEdit(d.nom) : '';

  const html = `
    <div class="form-field">
      <label>EPIC <span class="req">*</span></label>
      <input type="text" id="f-epic" list="dl-epic" value="${esc(epicVal)}" placeholder="EPIC 1 – Gestion des données">
      <datalist id="dl-epic">${epicOptions()}</datalist>
    </div>
    <div class="form-field">
      <label>ID User Story <span class="req">*</span></label>
      <input type="text" id="f-id" value="${esc(d ? d.nom : '')}" placeholder="US10.1">
    </div>
    <div class="form-field">
      <label>Libellé User Story <span class="req">*</span></label>
      <input type="text" id="f-libelle" value="${esc(d ? d.libelle : '')}">
    </div>
    <div class="form-field">
      <label>MVP</label>
      <select id="f-mvp">
        <option value="True" ${mvpVal === 'True' ? 'selected' : ''}>True</option>
        <option value="False" ${mvpVal === 'False' ? 'selected' : ''}>False</option>
      </select>
    </div>
    <div class="form-field">
      <label>Front_or_Back</label>
      <select id="f-frontback">
        <option value="Front-end" ${frontVal === 'Front-end' ? 'selected' : ''}>Front-end</option>
        <option value="Backend" ${frontVal === 'Backend' ? 'selected' : ''}>Backend</option>
      </select>
    </div>
    <div class="form-field">
      <label>Module</label>
      <input type="text" id="f-module" value="${esc(d ? d.module : '')}" placeholder="Gestion des données & catalogue">
    </div>
    <div class="form-field">
      <label>Dépend de (Parent)</label>
      <div class="dep-wrap">
        <div class="dep-chips" id="dep-chips"></div>
        <div class="dep-input-row">
          <input type="text" id="f-dep-input" list="dl-us" placeholder="Ajouter un parent…">
          <datalist id="dl-us">${usListHtml()}</datalist>
          <button type="button" onclick="addDep()" style="margin-left:0;flex:0 0 auto">+</button>
        </div>
      </div>
    </div>
    <div class="form-field">
      <label>Type fonctionnel</label>
      <select id="f-typ">
        <option value=""></option>
        ${TYPES.map(t => `<option value="${esc(t)}" ${typVal === t ? 'selected' : ''}>${esc(t)}</option>`).join('')}
      </select>
    </div>
    <div class="form-field">
      <label>Pilier(s)</label>
      <input type="text" id="f-pilier" list="dl-pilier" value="${esc(pilierVal)}">
      <datalist id="dl-pilier">${PILIERS.map(p => `<option value="${esc(p)}">`).join('')}</datalist>
    </div>
    <div class="form-field">
      <label>Profil utilisateur</label>
      <input type="text" id="f-role" list="dl-role" value="${esc(roleVal)}">
      <datalist id="dl-role">${ROLES.map(r => `<option value="${esc(r)}">`).join('')}</datalist>
    </div>
    <div class="form-field">
      <label>Phrase méthode agile</label>
      <textarea id="f-phrase">${esc(d ? d.phrase : '')}</textarea>
    </div>
    ${scenariosHtml}
  `;

  return html;
}

// État du formulaire d'édition après insertion dans le DOM.
function wireEditForm() {
  renderDepChips();
  const input = document.getElementById('f-dep-input');
  if (input) {
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); addDep(); }
    });
  }
}

function renderDepChips() {
  const box = document.getElementById('dep-chips');
  if (!box) return;
  box.innerHTML = dependList.map(id =>
    `<span class="chip" title="Retirer" onclick="removeDep('${esc(id)}')">${esc(id)}<span class="x">✕</span></span>`
  ).join('') || '<em style="color:#9aa1a8;font-size:12px">Aucune dépendance</em>';
}

function addDep() {
  const input = document.getElementById('f-dep-input');
  const val = (input.value || '').trim().replace(/^US\s*/, 'US');
  if (val) {
    if (!dependList.includes(val)) {
      if (!US[val]) { toast('US inconnue : ' + val + ' — utilisez une US existante ou créez-la d\'abord.', 'error'); input.value = ''; return; }
      dependList.push(val);
      renderDepChips();
    }
    input.value = '';
  }
}

function removeDep(id) {
  dependList = dependList.filter(x => x !== id);
  renderDepChips();
}

// --- Scénario CRUD ---
async function addScenario() {
  if (!editingId) return;
  const res = await fetch(`${API_BASE}/scenarios`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ usId: editingId })
  });
  const json = await res.json().catch(() => ({}));
  if (!res.ok || json.ok === false) { toast('Erreur ajout scénario : ' + (json.error || 'HTTP ' + res.status), 'error'); return; }
  toast('Scénario créé ✓');
  await reloadAndRender();
  openDetail(editingId);
}

async function deleteScenario(ident) {
  if (!confirm('Supprimer le scénario ' + ident + ' ?')) return;
  const res = await fetch(`${API_BASE}/scenarios/${encodeURIComponent(ident)}`, { method: 'DELETE' });
  const json = await res.json().catch(() => ({}));
  if (!res.ok || json.ok === false) { toast('Erreur suppression : ' + (json.error || 'HTTP ' + res.status), 'error'); return; }
  toast('Scénario supprimé ✓');
  await reloadAndRender();
  if (editingId) openDetail(editingId);
}

function openScenario(ident) {
  const sc = SCENARIOS_MAP[ident];
  if (!sc) return;
  currentScenarioIdent = ident;
  scenarioEditing = true;
  const panel = document.getElementById('detail');
  panel.classList.remove('closed');
  detailOpen = true;
  document.getElementById('d-title').textContent = sc.ident + ' — ' + sc.libelle;
  const body = document.getElementById('d-body');
  body.innerHTML = `
    <div class="form-field"><label>Identifiant</label><input type="text" id="sc-ident" value="${esc(sc.ident)}" readonly></div>
    <div class="form-field"><label>Libellé scénario</label><input type="text" id="sc-libelle" value="${esc(sc.libelle)}"></div>
    <div class="form-field"><label>Scénario testable (complet)</label><textarea id="sc-scenario" style="min-height:120px;">${esc(sc.scenario)}</textarea></div>
  `;
  document.getElementById('d-actions').style.display = 'flex';
  document.getElementById('d-actions').innerHTML = `
    <button onclick="saveScenario()">Enregistrer</button>
    <button onclick="backToUs()">Retour à l'US</button>
    <button class="danger" onclick="deleteScenario('${esc(ident)}')">Supprimer</button>
  `;
}

async function saveScenario() {
  if (!currentScenarioIdent) return;
  const libelle = document.getElementById('sc-libelle').value.trim();
  const scenario = document.getElementById('sc-scenario').value.trim();
  const res = await fetch(`${API_BASE}/scenarios/${encodeURIComponent(currentScenarioIdent)}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ libelle, scenario })
  });
  const json = await res.json().catch(() => ({}));
  if (!res.ok || json.ok === false) { toast('Erreur enregistrement : ' + (json.error || 'HTTP ' + res.status), 'error'); return; }
  toast('Scénario enregistré ✓');
  scenarioEditing = false;
  currentScenarioIdent = null;
  await reloadAndRender();
  if (editingId) openDetail(editingId);
}

function backToUs() {
  scenarioEditing = false;
  currentScenarioIdent = null;
  if (editingId) openDetail(editingId);
}

function openDetail(id) {
  const d = US_DATA[id];
  if (!d) return;
  const panel = document.getElementById('detail');
  panel.classList.remove('closed');
  detailOpen = true;
  editingId = id;
  document.getElementById('d-title').textContent = d.nom + ' — ' + d.libelle;
  document.getElementById('d-body').innerHTML = EDIT_MODE ? renderEditForm(d) : renderReadOnly(d);
  document.getElementById('d-actions').style.display = EDIT_MODE ? 'flex' : 'none';
  if (EDIT_MODE) wireEditForm();
}

function closeDetail() {
  document.getElementById('detail').classList.add('closed');
  detailOpen = false;
  editingId = null;
  scenarioEditing = false;
  currentScenarioIdent = null;
  if (window.network) window.network.unselectAll();
}

function initDetail() {
  const panel = document.getElementById('detail');
  const resizer = document.getElementById('d-resizer');
  resizer.addEventListener('mousedown', e => {
    e.preventDefault();
    const startX = e.clientX;
    const startW = panel.offsetWidth;
    const move = ev => {
      const w = startW - (ev.clientX - startX);
      panel.style.width = Math.min(Math.max(w, 300), Math.round(window.innerWidth * 0.8)) + 'px';
    };
    const up = () => {
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
    };
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  });
}

// Nouvelle US : ouvre le formulaire vide
function newUs() {
  if (!EDIT_MODE) return;
  const panel = document.getElementById('detail');
  panel.classList.remove('closed');
  detailOpen = true;
  editingId = null;
  document.getElementById('d-title').textContent = 'Nouvelle User Story';
  document.getElementById('d-body').innerHTML = renderEditForm(null);
  wireEditForm();
}

// Récupère les valeurs du formulaire
function gatherForm() {
  const val = id => (document.getElementById(id)?.value || '').trim();
  return {
    epic: val('f-epic'),
    id: val('f-id'),
    libelle: val('f-libelle'),
    mvp: val('f-mvp'),
    frontback: val('f-frontback'),
    module: val('f-module'),
    depend: dependList.slice(),
    typ: val('f-typ'),
    pilier: val('f-pilier'),
    role: val('f-role'),
    phrase: val('f-phrase')
  };
}

async function saveForm() {
  const us = gatherForm();
  if (!us.id || !us.libelle) { toast('Champs requis : ID User Story et Libellé.', 'error'); return; }
  const newId = us.id;
  if (newId !== editingId && US[newId]) { toast('L\'ID « ' + newId + ' » existe déjà.', 'error'); return; }

  const method = editingId ? 'PUT' : 'POST';
  const url = editingId ? `${API_BASE}/backlog/${encodeURIComponent(editingId)}` : `${API_BASE}/backlog`;
  const res = await fetch(url, {
    method,
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ us })
  });
  const json = await res.json().catch(() => ({}));
  if (!res.ok || json.ok === false) {
    toast('Erreur : ' + (json.error || 'HTTP ' + res.status), 'error');
    return;
  }
  toast('Enregistré ✓' + (json.backup ? ' — backup : ' + json.backup.name : ''));
  await reloadAndRender();
  if (EDIT_MODE) openDetail(json.id || newId);
}

async function deleteForm() {
  if (!editingId) return;
  if (!confirm('Supprimer définitivement l\'US ' + editingId + ' ?')) return;
  const res = await fetch(`${API_BASE}/backlog/${encodeURIComponent(editingId)}`, { method: 'DELETE' });
  const json = await res.json().catch(() => ({}));
  if (!res.ok || json.ok === false) {
    toast('Erreur suppression : ' + (json.error || 'HTTP ' + res.status), 'error');
    return;
  }
  toast('US supprimée ✓' + (json.backup ? ' — backup : ' + json.backup.name : ''));
  closeDetail();
  await reloadAndRender();
}

// Recharge les données et rafraîchit le graphe + facettes + navigation
async function reloadAndRender() {
  await loadUsData();
  allNodes = buildNodes();
  allEdges = DEP.map(([from, to]) => ({ from, to, arrows: 'to', color: { color: '#e6e8eb' }, smooth: { type: 'dynamic' } }));
  renderFacets();
  renderGroupNav();
  applyFilter();
  document.getElementById('count').textContent = `${allNodes.length} US · ${allEdges.length} dépendances`;
}

function linkedIds() {
  const s = new Set();
  DEP.forEach(([from, to]) => { s.add(from); s.add(to); });
  return s;
}

function renderGroupNav() {
  const nav = document.getElementById('groupnav');
  const cats = currentColoring === 'epic' ? Object.keys(EPICS) : Object.keys(FINALITES);
  const chip = c => currentColoring === 'epic' ? EPICS[c] : FINALITES[c].color;

  let items = [`<span class="gn-btn" onclick="setGroup()">Tout</span>`];
  cats.forEach(c => {
    const disp = currentColoring === 'epic'
      ? c + ' · ' + EPIC_LABELS[c]
      : c;
    items.push(`<span class="gn-btn" data-val="${c.replace(/['"]/g,'')}" onclick="setGroup('${currentColoring}','${c.replace(/['"]/g,'')}')">${disp}</span>`);
  });
  nav.innerHTML = items.join(' ');

  nav.querySelectorAll('.gn-btn').forEach(bt => {
    const val = bt.dataset.val;
    if (!val) return;
    const col = chip(val);
    bt.style.background = col;
    bt.style.borderColor = col;
    const rgb = parseInt(col.slice(1), 16);
    const r = (rgb >> 16) & 255, g = (rgb >> 8) & 255, b = rgb & 255;
    const lum = 0.299 * r + 0.587 * g + 0.114 * b;
    bt.style.color = lum > 150 ? '#1a1c1f' : '#fff';
    if (activeGroup && activeGroup.valeur === val) bt.classList.add('active');
  });
}

let allNodes = [];
let allEdges = [];

function buildNodes() {
  return Object.keys(US).map(nodeAppearance);
}

function computeShownIds() {
  let shown = new Set(Object.keys(US));
  if (activeGroup) {
    const keep = id => {
      const grp = currentColoring === 'epic' ? US[id][0] : US_FINALITE[id];
      return grp === activeGroup.valeur;
    };
    shown = new Set(Object.keys(US).filter(keep));
  }
  if (linkedOnly) {
    const linked = linkedIds();
    shown = new Set([...shown].filter(id => linked.has(id)));
  }
  if (facets.role.size || facets.ihm.size || facets.mvp.size) {
    shown = new Set([...shown].filter(id => facetMatches(id)));
  }
  return shown;
}

function applyFilter() {
  const shown = computeShownIds();
  const nodes = allNodes.filter(n => shown.has(n.id));
  const edges = allEdges.filter(e => shown.has(e.from) && shown.has(e.to));
  window.network.setData({ nodes: nodes, edges: edges });
  document.querySelector('#btnFilter').textContent = linkedOnly ? 'Tout afficher' : 'Afficher US liées uniquement';
  window.network.fit({ animation: true });
}

function setGroup(mode, valeur) {
  if (!mode) activeGroup = null;
  else activeGroup = { mode, valeur };
  renderGroupNav();
  allNodes = buildNodes();
  applyFilter();
}

function toggleLinked() {
  linkedOnly = !linkedOnly;
  applyFilter();
}

function renderStatus() {
  const el = document.getElementById('status');
  if (EDIT_MODE) {
    el.innerHTML = `<i class="fa-solid fa-pen"></i> <b>Mode édition</b> — fichier : ${esc(FILE_INFO ? FILE_INFO.file : '')} · archive : ${esc(FILE_INFO ? FILE_INFO.archiveDir : '')} · <span style="color:#8bc34a">enregistrement direct après chaque modification</span>`;
  } else {
    el.innerHTML = `<i class="fa-solid fa-eye"></i> <b>Mode lecture seule</b> — données : backlog.csv (GitHub). Lancer le serveur local (annexes/serveur-graphe) pour éditer backlog.xlsx.`;
  }
}

function main() {
  renderStatus();
  renderLegend('epic');
  renderGroupNav();
  renderFacets();
  initDetail();

  allNodes = buildNodes();
  allEdges = DEP.map(([from, to]) => ({
    from, to, arrows: 'to', color: { color: '#e6e8eb' }, smooth: { type: 'dynamic' }
  }));

  const container = document.getElementById('graph');

  const stablePhysicsOptions = {
    nodes: { shape: 'square', shadow: { enabled: true }, size: 46, margin: { top: 14, right: 18, bottom: 14, left: 18 } },
    edges: { width: 1.5, selectionWidth: 2 },
    physics: { stabilization: true, barnesHut: { gravitationalConstant: -3500 } }
  };
  const hierarchicalOptions = {
    nodes: { shape: 'square', shadow: { enabled: true }, size: 46, margin: { top: 14, right: 18, bottom: 14, left: 18 } },
    edges: { width: 1.5 },
    layout: { hierarchical: { direction: 'UD', sortMethod: 'directed', nodeSpacing: 110, levelSeparation: 90, treeSpacing: 140 } },
    physics: false,
    interaction: { hover: true, tooltipDelay: 200 }
  };

  let network = new vis.Network(container, { nodes: allNodes, edges: allEdges }, stablePhysicsOptions);
  window.network = network;

  network.on('selectNode', params => {
    if (params.nodes && params.nodes.length) openDetail(params.nodes[0]);
  });
  network.on('deselectNode', () => {});

  document.getElementById('count').textContent = `${allNodes.length} US · ${allEdges.length} dépendances`;

  window.resetView = () => { activeGroup = null; linkedOnly = false; facets = { role: new Set(), ihm: new Set(), mvp: new Set() }; renderFacets(); allNodes = buildNodes(); renderGroupNav(); network.setOptions(stablePhysicsOptions); network.setData({ nodes: allNodes, edges: allEdges }); network.fit({ animation: true }); };
  window.applyPhysics = () => network.setOptions(stablePhysicsOptions);
  window.applyHierarchy = () => network.setOptions(hierarchicalOptions);
  window.openDetail = openDetail;
  window.closeDetail = closeDetail;
  window.newUs = newUs;
  window.saveForm = saveForm;
  window.deleteForm = deleteForm;
  window.addDep = addDep;
  window.removeDep = removeDep;
  window.toggleFacet = toggleFacet;
  window.clearFacet = clearFacet;
  window.setGroup = setGroup;
  window.setColoring = setColoring;
  window.toggleLinked = toggleLinked;
  window.addScenario = addScenario;
  window.deleteScenario = deleteScenario;
  window.openScenario = openScenario;
  window.saveScenario = saveScenario;
  window.backToUs = backToUs;
}

// Détection du mode édition (serveur local) avec timeout court
async function detectMode() {
  try {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 1500);
    const res = await fetch(API_BASE + '/health', { signal: ctrl.signal });
    clearTimeout(t);
    if (res.ok) {
      const j = await res.json();
      EDIT_MODE = !!j.ok && j.mode === 'edit';
    }
  } catch (e) {
    EDIT_MODE = false;
  }
}

window.addEventListener('DOMContentLoaded', async () => {
  await detectMode();
  if (EDIT_MODE) document.getElementById('btnNew').style.display = 'inline-block';
  try {
    await loadUsData();
  } catch (e) {
    document.getElementById('count').textContent = 'Erreur chargement : ' + e.message;
    renderStatus();
    return;
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(main);
  else main();
});
</script>
